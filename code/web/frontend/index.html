<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OER 工作台</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --border:#e4e7ec; --border-strong:#d3d9e0;
  --primary:#1677ff; --primary-dark:#0958d9; --primary-soft:#e6f4ff;
  --text:#26282b; --text-2:#5b6270; --text-3:#9aa2b0;
  --accent:#d4380d; --success:#389e0d; --warn:#d48806;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,50,.05),0 1px 2px rgba(20,30,50,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;height:100vh}
#root{height:100vh}
.app{display:flex;height:100vh}
/* ===== 左侧导航 ===== */
.nav{width:176px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 16px 12px;font-size:15px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px}
.nav-item{padding:10px 16px;cursor:pointer;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:9px;
  border-left:3px solid transparent;transition:all .12s}
.nav-item:hover{background:var(--primary-soft);color:var(--primary)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item .n{width:20px;height:20px;border-radius:50%;background:#eef1f5;color:var(--text-2);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item.active .n{background:var(--primary);color:#fff}
.nav-foot{margin-top:auto;padding:14px 16px;font-size:11px;color:var(--text-3);line-height:1.6}
/* ===== 主区 ===== */
.main{flex:1;overflow:auto;padding:20px 24px}
.panel-title{font-size:16px;font-weight:700;margin-bottom:4px}
.panel-desc{font-size:12px;color:var(--text-2);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text)}
.card h4::before{content:'';display:inline-block;width:3px;height:12px;background:var(--primary);border-radius:2px;margin-right:7px;vertical-align:-1px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:13px;background:#fbfcfe;color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.12)}
.btn{padding:8px 16px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:all .12s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#b9c4d6;cursor:not-allowed}
.btn-ghost{background:#f0f2f5;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:#e6e9ee}
.btn-sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.meta{font-size:11px;color:var(--text-2);line-height:1.7}
.meta strong{color:var(--text)}
.mono{font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:var(--text-3);line-height:1.6}
.ok{color:var(--success)} .warn{color:var(--warn)} .err{color:var(--accent)}
.chart{height:300px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f2f4f7;text-align:left;padding:6px 10px;color:var(--text-2);font-weight:600}
td{padding:6px 10px;border-bottom:1px solid #eef1f4}
.tip{padding:8px 12px;border-radius:7px;font-size:12px;background:#fff7e6;border:1px solid #ffe7ba;color:#874d00}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API_BASE = '';

/* ===================== 图表封装 ===================== */
function ChartBox({ option, height=300 }) {
  const ref=useRef(null); const inst=useRef(null);
  const optionRef=useRef(option); optionRef.current=option;
  // 首次 option 更新：容器可见则立即 init；不可见（display:none）则等 ResizeObserver
  useEffect(()=>{
    if(!ref.current) return;
    if(ref.current.offsetWidth>0&&ref.current.offsetHeight>0){
      if(!inst.current) inst.current=echarts.init(ref.current);
      inst.current.setOption(option,true);
    }
  },[option]);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const ro=new ResizeObserver(()=>{
      if(!inst.current&&el.offsetWidth>0&&el.offsetHeight>0){
        try{inst.current=echarts.init(el);inst.current.setOption(optionRef.current,true);}catch(e){}
      }else if(inst.current){inst.current.resize();}
    });
    ro.observe(el);
    return ()=>{ro.disconnect();inst.current&&inst.current.dispose();inst.current=null;};
  },[]);
  return <div ref={ref} className="chart" style={{height}}/>;
}

/* ===================== 三列数据文本解析（.txt/.csv/.dat 共用） ===================== */
// 之前 FileDropZone / handleFolder+loadLocalFile 各自内联了一份几乎相同的解析逻辑，
// 且只按空白符切分——真正的逗号分隔 .csv（扩展名已声明支持）会解析失败。
// 这里统一支持空白符、逗号、分号、Tab，并去掉表头等非数字行。
function parseTraceText(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const rows=lines.map(line=>{
    const c=line.trim().split(/[\s,;]+/).map(parseFloat);
    return [c[0],c[1],c[2]];
  }).filter(d=>d.length===3&&d.every(v=>Number.isFinite(v)));
  return rows;
}

/* ===================== 文件拖放 ===================== */
function FileDropZone({ onFileLoaded, expData }) {
  const [dragOver,setDragOver]=useState(false);
  const inputRef=useRef(null);
  const parseFile=(file)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      onFileLoaded({name:file.name,rows:parseTraceText(e.target.result)});
    };
    reader.readAsText(file);
  };
  return (<div>
    <div className="drop-zone" style={{border:'1px dashed var(--border-strong)',borderRadius:10,padding:'18px 12px',textAlign:'center',
      cursor:'pointer',background:dragOver?'var(--primary-soft)':expData?'#f6ffed':'#fafbfc',transition:'all .12s'}}
      onDrop={e=>{e.preventDefault();setDragOver(false);if(e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0]);}}
      onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
      onClick={()=>inputRef.current?.click()}>
      <div style={{fontSize:13}}>{expData?`✅ ${expData.name}`:'拖放数据文件，或点击选择'}</div>
      {expData&&<div className="meta" style={{marginTop:4}}>{expData.rows.length.toLocaleString()} 个数据点</div>}
    </div>
    <input ref={inputRef} type="file" accept=".txt,.csv,.dat" style={{display:'none'}}
      onChange={e=>{if(e.target.files[0])parseFile(e.target.files[0]);}}/>
  </div>);
}

/* ===================== 参数面板（折叠） ===================== */
const PARAM_GROUPS=[
  {title:'热力学描述符',params:[
    {key:'G_OH',label:'G_OH',unit:'eV'},{key:'G_O',label:'G_O',unit:'eV'},{key:'scaling_OOH_OH',label:'scaling_OOH_OH',unit:'eV'}]},
  {title:'预氧化',params:[{key:'E0_pre',label:'E0_pre',unit:'V'},{key:'k0_pre',label:'k0_pre',unit:'s⁻¹'}]},
  {title:'AEM 动力学',params:[
    {key:'k0_1',label:'k0_1',unit:'s⁻¹'},{key:'k0_2',label:'k0_2',unit:'s⁻¹'},
    {key:'k0_3',label:'k0_3',unit:'s⁻¹'},{key:'k0_4',label:'k0_4',unit:'s⁻¹'}]},
  {title:'扫描',params:[
    {key:'E_start',label:'E_start',unit:'V'},{key:'E_end',label:'E_end',unit:'V'},
    {key:'f',label:'f',unit:'Hz'},{key:'dE',label:'dE',unit:'V'},{key:'n_points',label:'n_points',unit:''}]},
  {title:'电极与电路',params:[
    {key:'Ru',label:'Ru',unit:'Ω'},{key:'Cdl',label:'Cdl',unit:'F/cm²'},{key:'A',label:'A',unit:'cm²'},
    {key:'gamma',label:'gamma',unit:'mol/cm²'},{key:'T',label:'T',unit:'K'},{key:'a',label:'a',unit:''}]},
];
function ParamPanel({params,onChange}) {
  const h=(k,v)=>onChange({...params,[k]:parseFloat(v)||0});
  return PARAM_GROUPS.map(g=>(
    <div key={g.title} style={{marginBottom:8}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--primary)',margin:'8px 0 4px'}}>{g.title}</div>
      {g.params.map(p=>(<div key={p.key} style={{display:'flex',alignItems:'center',margin:'3px 0'}}>
        <span style={{width:96,flexShrink:0,fontSize:12,color:'var(--text-2)'}}>{p.label}</span>
        <input className="mono" type="number" step={p.step||0.01} value={params[p.key]??''}
          onChange={e=>h(p.key,e.target.value)}
          style={{flex:1,padding:'4px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12,background:'#fbfcfe'}}/>
        <span style={{width:44,fontSize:11,color:'var(--text-3)',paddingLeft:6}}>{p.unit}</span>
      </div>))}
    </div>));
}

const AEM_PARAM_BOUNDS={k0_1:[1e-2,1e4],k0_2:[1e-2,1e4],k0_3:[1e-2,1e4],k0_4:[1e-2,1e4],
  G_OH:[0.9,1.7],G_O:[2.3,3.3],scaling_OOH_OH:[2.9,3.5],gamma:[1e-10,1e-7]};
function formatHarmonics(list){if(!list||!list.length)return '无，仅 DC';return list.map(h=>`H${h}`).join(', ');}
// 降采样：均匀抽取 maxN 个点，避免 ECharts 渲染几十万点导致白屏
function downsample(arr,maxN=500){
  if(!arr||!arr.length)return [];
  if(arr.length<=maxN)return arr.slice();
  const step=arr.length/maxN;
  const out=[];
  for(let i=0;i<maxN;i++)out.push(arr[Math.floor(i*step)]);
  out.push(arr[arr.length-1]);
  return out;
}
function downsampleXY(x,y,maxN=500){
  if(!x||!y)return{x:[],y:[]};
  if(x.length<=maxN)return{x,y};
  const step=x.length/maxN; const ox=[],oy=[];
  for(let i=0;i<maxN;i++){const k=Math.floor(i*step);ox.push(x[k]);oy.push(y[k]);}
  ox.push(x[x.length-1]);oy.push(y[y.length-1]);
  return{x:ox,y:oy};
}
// 旧版 Web 图表辅助：坐标对 + 单条线 + 实验虚线
const MODEL_COLOR='#1677ff';
function pairs(x,y,maxN=800){if(!x||!y)return[];const d=downsampleXY(x,y,maxN);return d.y.map((v,i)=>[+d.x[i].toFixed(5),+v.toExponential(6)]);}
function singleLine(data,color,label){return{name:label,type:'line',showSymbol:false,smooth:true,lineStyle:{width:1.5,color},data};}
function expLine(data){return{name:'实验',type:'line',showSymbol:false,smooth:true,lineStyle:{width:1.2,type:'dashed',color:'#d4380d'},data};}
function makeOpt({xName,yName,series,yOpt={},legend=false}){
  return{tooltip:{trigger:'axis',confine:true},
    legend:legend?{top:0,itemWidth:14,itemHeight:8,textStyle:{fontSize:9},type:'scroll'}:undefined,
    grid:{top:legend?34:20,right:20,bottom:40,left:62},
    xAxis:{type:'value',name:xName,nameLocation:'middle',nameGap:30,axisLabel:{fontSize:9},scale:true},
    yAxis:Object.assign({type:'value',axisLabel:{fontSize:9,formatter:v=>+v.toExponential(1)},name:yName},yOpt),
    series};
}

/* ===================== ① 样品与电极常量 ===================== */
// 注：原先这里还有一个独立的 <SampleStep> 组件，但 App 的导航只有「数据与正演」
// 「项目结果」两步，样品信息实际是作为可折叠面板嵌在 WorkStep 里的（见下方
// sampleOpen 部分）。SampleStep 从未被渲染，属于死代码，已删除；如果之后想把
// 「样品与电极」独立成第一步，可以把这段折叠面板的 JSX 抽出来重新做成组件。
const CATALYST='四氧化三钴（Co₃O₄）';
const SUPPORTS=['钛毡','钛箔'];
const REFERENCES=['Ag/AgCl（饱和 KCl）','Hg/HgO（1 M KOH）','可逆氢电极 RHE'];

/* ===================== ② 数据与正演（合并） ===================== */
const STRICTNESS=[
  {id:'loose',label:'宽松',desc:'允许更低信噪比的高阶谐波进入建议'},
  {id:'standard',label:'标准',desc:'按默认可解析性阈值建议'},
  {id:'strict',label:'严格',desc:'只保留信噪比很高的谐波'},
];
function WorkStep({expData,setExpData,expAnalysis,setExpAnalysis,setError,strictness,setStrictness,sample,setSample}) {
  const [localFiles,setLocalFiles]=useState([]); const [localSel,setLocalSel]=useState('');
  const [sampleOpen,setSampleOpen]=useState(false);
  const sf=(k,v)=>setSample&&setSample(s=>({...s,[k]:v}));
  const dirRef=useRef(null);
  const [params,setParams]=useState({}); const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null); const [advOpen,setAdvOpen]=useState(false);
  const [invTrials,setInvTrials]=useState(10); const [invLoading,setInvLoading]=useState(false);
  const [invResult,setInvResult]=useState(null); const [invError,setInvError]=useState(null);
  const [invHistory,setInvHistory]=useState([]); // 同一次数据的累积收敛历史
  const invAbortRef=useRef(null); // 反演请求的 AbortController，用于「取消」按钮
  useEffect(()=>{fetch(`${API_BASE}/api/params/defaults`).then(r=>r.json()).then(setParams).catch(()=>{});},[]);
  const handleFile=async(d)=>{
    setExpData(d);setExpAnalysis(null);
    try{
      // strictness 一并发给后端：阈值应由科学侧代码/配置决定，前端只负责传递选择，
      // 不再自行发明一套独立的判定逻辑（见下方 suggested() 的兼容性说明）。
      const res=await fetch(`${API_BASE}/api/data/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:d.rows,strictness})});
      const data=await res.json();if(!data.success)setError('数据解析失败: '+data.error);else setExpAnalysis(data);
    }catch(e){setError('数据解析失败: '+e.message);}
  };
  // 严格程度切换后，用同一份已加载数据重新请求后端判定（而不是仅在前端改阈值）。
  // 若后端暂未按 strictness 重算，返回内容不变，suggested() 的前端兜底阈值会继续生效。
  useEffect(()=>{ if(expData&&expData.rows&&expData.rows.length) handleFile(expData); },[strictness]);
  const handleFolder=(e)=>{
    const files=Array.from(e.target.files||[]);
    const txt=files.filter(f=>/\.(txt|csv|dat)$/i.test(f.name));
    if(txt.length){setLocalFiles(txt);setLocalSel(txt[0].name);}else{setError('文件夹中没有 .txt/.csv/.dat 文件');}
    e.target.value='';
  };
  const loadLocalFile=async()=>{
    const f=localFiles.find(x=>x.name===localSel);
    if(!f)return;
    setExpData({name:f.name});setExpAnalysis(null);setError(null);
    try{
      const text=await f.text();
      const rows=parseTraceText(text);
      if(rows.length<1024)throw new Error('有效数据点不足 1024');
      await handleFile({name:f.name,rows});
    }catch(e){setError('本地数据解析失败: '+e.message);}
  };
  // 谐波建议直接用科学侧结果（analyze 已按当前 strictness 算好，前端不发明阈值）
  const suggested=()=>{
    if(!expAnalysis) return [];
    const hq=expAnalysis.harmonic_quality;
    if(!hq) return expAnalysis.suggested_fit_harmonics||[];
    return hq.fit_harmonics||[];
  };
  const sug=suggested();
  const hqChannels=(expAnalysis&&expAnalysis.harmonic_quality&&expAnalysis.harmonic_quality.channels)||[];
  const simulate=async()=>{
    setLoading(true);setError(null);
    try{const res=await fetch(`${API_BASE}/api/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...params})});
      if(!res.ok){setError(`正演请求失败：HTTP ${res.status}`);setLoading(false);return;}
      const data=await res.json();if(data.success){data.source='manual';setResult(data);}else setError(data.error);
    }catch(e){setError(e.message);}setLoading(false);
  };
  const cancelInversion=()=>{
    // 注：这只中止前端等待，后端 TPE 任务当前是同步阻塞调用，进程本身不会停。
    // 真正可中止/可轮询的任务模型需要后端把 /api/inversion/tpe 改成提交+轮询式接口
    // （见 README 里「统一接入语义」的建议），这里先保证前端不会一直卡住。
    if(invAbortRef.current) invAbortRef.current.abort();
    setInvLoading(false);setInvError('已取消等待（后端可能仍在计算，结果不会显示）');
  };
  const runInversion=async()=>{
    if(!expAnalysis){setInvError('请先导入数据');return;}
    setInvLoading(true);setInvError(null);setInvResult(null);
    const ac=new AbortController(); invAbortRef.current=ac;
    try{
      const m=expAnalysis.meta;
      // 拟合通道用科学侧建议（而非硬编码 H1-H3）
      const fit=(expAnalysis.harmonic_quality&&expAnalysis.harmonic_quality.fit_harmonics)||expAnalysis.suggested_fit_harmonics||[1,2,3];
      const tafelOk=!!(expAnalysis.calib&&expAnalysis.calib.tafel&&expAnalysis.calib.tafel.success);
      const payload={
        target:{tdc:expAnalysis.tdc,dc:expAnalysis.dc,harmonics:expAnalysis.harmonics,tafel:tafelOk?expAnalysis.calib.tafel.tafel_slope:null},
        config:{E_start:m.E_start,E_end:m.E_end,f:m.f,dE:m.dE,n_points:512,points_per_cycle:64,feature_grid_size:64},
        initial_params:{k0_1:params.k0_1,k0_2:params.k0_2,k0_3:params.k0_3,k0_4:params.k0_4,
          G_OH:params.G_OH,G_O:params.G_O,scaling_OOH_OH:params.scaling_OOH_OH,gamma:params.gamma},
        fixed_params:{Cdl:params.Cdl,Ru:params.Ru,A:params.A,E0_pre:params.E0_pre,k0_pre:params.k0_pre},
        param_bounds:AEM_PARAM_BOUNDS,fit_harmonics:fit,n_trials:invTrials,
      };
      const res=await fetch(`${API_BASE}/api/inversion/tpe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ac.signal});
      if(!res.ok){setInvError(`反演请求失败：HTTP ${res.status}`);setInvLoading(false);return;}
      const data=await res.json();if(!data.success){setInvError(data.error);setInvLoading(false);return;}
      setInvResult(data);
      // 收敛历史累积：同一次数据的多次反演追加到同一曲线
      if(data.history&&data.history.length){
        setInvHistory(prev=>{
          const offset=prev.length;
          let runningBest=prev.length?prev[prev.length-1].best:Infinity;
          const added=data.history.map(item=>{
            const v=Number(item.value);
            if(v<runningBest) runningBest=v;
            return {trial:offset+Number(item.trial||0), value:v, best:runningBest};
          });
          return [...prev,...added];
        });
      }
      // 反演结果更新到参数表 → 支持连续反演（下次以本次 best 为初值继续优化）；
      // 同时同步实验扫描参数，保证「反演后点正演」与「反演参数正演」图严格一致
      setParams(p=>({...p,...data.best_params,
        E_start:+m.E_start.toFixed(4),E_end:+m.E_end.toFixed(4),f:+m.f.toFixed(4),dE:+m.dE.toFixed(4)}));
      // 反演完成后立即用 best_params 正演，右栏图实时更新（无需再点正演）
      const simParams={...params,...data.best_params,E_start:m.E_start,E_end:m.E_end,f:m.f,dE:m.dE,n_points:512,points_per_cycle:64};
      const simRes=await fetch(`${API_BASE}/api/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(simParams)});
      const simData=await simRes.json();if(simData.success){simData.source='inversion';setResult(simData);}else setError('反演参数正演失败: '+simData.error);
    }catch(e){ if(e.name!=='AbortError') setInvError(e.message); }
    setInvLoading(false);
  };
  // 判断参数是否顶到边界（→ 可能未分辨），并给出原因
  const markParam=(k,v)=>{
    const b=AEM_PARAM_BOUNDS[k];
    if(!b) return null;

function ResultsStep({setError}) {
  const [data,setData]=useState(null);

    Promise.all([
      fetch(`${API_BASE}/api/results/data-quality`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/sensitivity`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/recovery-s1`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/sensitivity-matrix`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/coupling`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/synthetic-recovery`).then(r=>r.json()),
      fetch(`${API_BASE}/api/wf/tasks`).then(r=>r.json()),

  },[]);

    .then(r=>r.json()).then(d=>setData(p=>p?{...p,p2d:d}:p)).catch(()=>{});},[profileSel]);
  if(!data)return <div className="panel-title">项目结果</div>;

    const xi=Object.fromEntries(xs.map((x,i)=>[x,i])); const yi=Object.fromEntries(ys.map((y,i)=>[y,i]));

      series:[{type:'heatmap',data:vals}]};
  };
  const ho=heatOpt();

    const m=data.matrix;

    const vals=[];
    m.rows.forEach((r,fi)=>{m.params.forEach((p,ci)=>{
      const v=parseFloat(r[p]||0); vals.push([ci,fi,v>0?Math.log10(v):-6]);});});
    return {tooltip:{position:'top',formatter:p=>{const v=Math.pow(10,p.value[2]);
      return `${m.features[p.value[1]]}<br/>${m.params[p.value[0]]} = ${v.toExponential(2)}`;}},
      grid:{top:10,right:16,bottom:60,left:96},
      xAxis:{type:'category',data:m.params.map(p=>({value:p,textStyle:{fontSize:9}})),axisLabel:{rotate:40,fontSize:9}},
      yAxis:{type:'category',data:m.features.map(f=>({value:f,textStyle:{fontSize:8}})),axisLabel:{fontSize:8}},
      visualMap:{min:-6,max:0,orient:'horizontal',left:'center',bottom:0,textStyle:{fontSize:9},
        inRange:{color:['#fff7ec','#fc8d59','#b30000']}},
      series:[{type:'heatmap',data:vals}]};
  };
  const matrixOptVal=matrixOpt();
  const dq=(data.dq&&data.dq.rows)||[]; const sens=(data.sens&&data.sens.rows)||[];
  const s1=data.s1&&data.s1.success?data.s1:null;
  const coupRows=(data.coupling&&data.coupling.rows)||[];

  const wfTasks=(data.wf&&data.wf.success&&data.wf.tasks)||[];
  return (<>

        <h4>项目结论</h4>
        <div className="meta" style={{lineHeight:1.9}}>
          <div><strong>G_OH–log₁₀(k0_1) 局部补偿</strong> <span className="warn">[LOCAL_ONLY]</span>：
            约 <strong>0.11 eV/dec</strong>（0.11324/0.11689/0.10917），与正向 BV 的 (1−α) 尺度一致，
            但仅限 mixed_a 附近有限协议范围，非全局物理标度。</div>
          <div><strong>参数耦合</strong>：G_OH↔G_O、k0_3↔G_OH 强补偿（2D profile r≈+0.999/1.000）；
            k0_2 与其他参数独立，可独立约束。</div>
          <div><strong>A6 状态</strong>：六参数单点恢复资格失败；k0_4 只能作为固定输入传播；
            无统一六维线性降维；V4.1 三协议在无噪声合成下无法恢复（S1 DESIGN_INSUFFICIENT）。</div>
        </div>
        <div className="hint" style={{marginTop:6}}>完整结论与边界见 <code>documents/project/PROJECT_SUMMARY.md</code>；
          本窗口为当前项目已确认结论（工程/数值等级），不自动升级为机理结论。</div>
      </div>
      <div className="card">
        <h4>实验数据质量</h4>
        <table><thead><tr><th>数据集</th><th>频率</th><th>振幅</th><th>拟合通道</th></tr></thead>
        <tbody>{dq.map(r=><tr key={r.filename}><td>{r.filename.replace('ftacv','FT')}</td><td>{r.f||'—'}</td><td>{r.dE||'—'}</td><td>{r.fit_harmonics||'n/a'}</td></tr>)}</tbody></table>
      </div>
      <div className="card">
        <h4>A6 参数分类</h4>
        <table><thead><tr><th>参数</th><th>分类</th><th>最大相关</th></tr></thead>
        <tbody>{sens.map(r=><tr key={r.parameter}>
          <td>{r.parameter}</td><td className={r.classification==='identifiable'?'ok':r.classification==='coupled'?'warn':'err'}>{r.classification}</td>
          <td>{Number(r.max_correlation).toFixed(2)}</td></tr>)}</tbody></table>
      </div>
      <div className="card">
        <h4>A6-v2 S1 合成恢复</h4>
        {s1?<div className="meta" style={{lineHeight:2}}>
          状态：<strong className={s1.scientific_gate_passed?'ok':'err'}>{s1.stage_status}</strong><br/>
          {s1.job_count} jobs × 100 trials · {s1.backend} · {s1.duration_h}h · {s1.n_ode_fail} ODE fail<br/>
          <span className="hint">eligible pairs：{s1.eligible_parameter_pairs.length===0?'（无）':s1.eligible_parameter_pairs.join(', ')}</span>
        </div>:<div className="hint">无 S1 归档</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>oer-wf 计算任务（只读 · Legion 正式计算归档）</h4>
        <table><thead><tr><th>任务</th><th>最新状态</th><th>runs</th><th></th></tr></thead>
          <tbody>{wfTasks.map(t=><tr key={t.task_id} style={{cursor:'pointer'}} onClick={()=>loadWfDetail(t.commit,t.task)}>
            <td>{t.task_id}</td>
            <td className={t.status==='SUCCESS'?'ok':'warn'}>{t.status}</td>
            <td>{t.runs}</td>
            <td style={{color:'var(--primary)',fontSize:11}}>{wfSel&&wfSel.commit===t.commit&&wfSel.task===t.task?'▾':'查看'}</td>
          </tr>)}</tbody></table>
        {wfSel&&wfSel.data&&wfSel.data.success&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
          <div className="meta" style={{marginBottom:6}}><strong>{wfSel.commit}/{wfSel.task}</strong> · {wfSel.data.runs.length} runs</div>
          {wfSel.data.runs.map(r=>(
            <div key={r.timestamp} style={{marginBottom:8}}>
              <div className="meta"><strong>{r.timestamp}</strong>
                {r.status&&<span className={r.status.status==='SUCCESS'?'ok':'warn'}> · {r.status.status}{r.status.exit_code!==undefined&&` · exit ${r.status.exit_code}`}</span>}
              </div>
              {r.summary&&<div className="hint">
                {r.summary.stage_status&&<span>stage_status: <b>{r.summary.stage_status}</b> · </span>}
                {r.summary.scientific_gate_passed!==undefined&&<span>科学门: <b>{r.summary.scientific_gate_passed?'PASS':'FAIL'}</b> · </span>}
                {r.summary.job_count&&<span>{r.summary.job_count} jobs · </span>}
                {r.summary.rows!==undefined&&<span>{r.summary.rows} rows · </span>}
                {r.summary.backend&&<span>{r.summary.backend}</span>}
              </div>}
              {r.files&&r.files.length>0&&<div className="hint" style={{marginTop:2}}>文件：{r.files.join(', ')}</div>}
            </div>))}
        </div>}
        {wfSel&&wfSel.error&&<div className="err hint" style={{marginTop:8}}>加载失败：{wfSel.error}</div>}
      </div>
      <div className="card">
        <h4>参数耦合方向</h4>
        {coupRows.length>0?<table><thead><tr><th>参数对</th><th>相关</th><th>方向</th></tr></thead>
          <tbody>{coupRows.map(r=><tr key={r.parameter+'-'+r.peer}>
            <td>{r.parameter}↔{r.peer}</td><td>{Number(r.correlation).toFixed(3)}</td>
            <td className={r.direction==='compensating'?'err':'warn'}>{r.direction}</td></tr>)}</tbody></table>
        :<div className="hint">无耦合数据</div>}
      </div>
      <div className="card">
        <h4>合成恢复</h4>
        {synth?<div className="meta" style={{lineHeight:1.9}}>
          commit：<strong>{synth.git_commit}</strong><br/>
          配置：<span className="hint">{(synth.configuration&&JSON.stringify(synth.configuration)).slice(0,120)}…</span><br/>
          <span className="hint">完整 summary 见 JSON 归档</span>
        </div>:<div className="hint">无合成恢复数据</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>敏感性矩阵（特征 × 参数，log₁₀）</h4>
        {matrixOptVal?<ChartBox option={matrixOptVal} height={460}/>:<div className="hint" style={{padding:30,textAlign:'center'}}>无敏感性矩阵</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>二维参数耦合 profile</h4>
        <div className="row" style={{marginTop:0}}>
          <select value={profileSel} onChange={e=>setProfileSel(e.target.value)} style={{padding:'5px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12}}>
            {(data.p2d&&data.p2d.summaries||[]).map(s=><option key={s.profile_id} value={s.profile_id}>{s.profile_id}</option>)}
          </select>
        </div>
        {ho?<ChartBox option={ho} height={400}/>:<div className="hint" style={{padding:30,textAlign:'center'}}>加载 profile…</div>}
        <table style={{marginTop:8}}><thead><tr><th>profile</th><th>r</th><th>Δ1x</th><th>Δ1y</th><th>耦合</th></tr></thead>
        <tbody>{(data.p2d&&data.p2d.summaries||[]).map(s=><tr key={s.profile_id}>
          <td>{s.profile_id}</td><td>{s.pearson_r_in_delta1.toFixed(3)}</td><td>{s.delta1_x_width.toFixed(3)}</td><td>{s.delta1_y_width.toFixed(3)}</td>
          <td className={s.coupling_strength>0.7?'err':'ok'}>{s.coupling_interpretation}</td></tr>)}</tbody></table>
      </div>
    </div>
  </>);
}

/* ===================== App ===================== */
function App() {
  const [step,setStep]=useState('work');
  const [sample,setSample]=useState({});
  const [expData,setExpData]=useState(null);
  const [expAnalysis,setExpAnalysis]=useState(null);
  const [strictness,setStrictness]=useState('standard');
  const [error,setError]=useState(null);
  // 惰性挂载：首次进入某步才挂载组件（保证 ChartBox 在可见时初始化），之后保留状态
  const [visited,setVisited]=useState({work:true});
  const go=(id)=>{setStep(id);setVisited(v=>v[id]?v:{...v,[id]:true});};
  const steps=[
    {id:'work',label:'数据与正演'},
    {id:'results',label:'项目结果'},
  ];
  return (<div className="app">
    <div className="nav">
      <div className="brand">OER 工作台<div className="sub">FTacV 参数反演</div></div>
      {steps.map((s,i)=>(<div key={s.id} className={`nav-item ${step===s.id?'active':''}`} onClick={()=>go(s.id)}>
        <span className="n">{i+1}</span>{s.label}</div>))}
      <div className="nav-foot">碱性 OER AEM · Co₃O₄<br/>展示层，计算外接</div>
    </div>
    <div className="main">
      {error&&<div className="tip" style={{background:'#fff1f0',border:'1px solid #ffccc7',color:'#a8071a',marginBottom:12}}>{error}
        <span style={{float:'right',cursor:'pointer'}} onClick={()=>setError(null)}>✕</span></div>}
      {/* 已访问的步骤保留挂载（display 切换不丢状态）；未访问的不渲染，避免 display:none 下 echarts 初始化崩溃 */}
      {visited.work&&<div style={{display:step==='work'?'block':'none'}}>
        <WorkStep expData={expData} setExpData={setExpData} expAnalysis={expAnalysis} setExpAnalysis={setExpAnalysis}
          setError={setError} strictness={strictness} setStrictness={setStrictness} sample={sample} setSample={setSample}/>
      </div>}
      {visited.results&&<div style={{display:step==='results'?'block':'none'}}><ResultsStep setError={setError}/></div>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
