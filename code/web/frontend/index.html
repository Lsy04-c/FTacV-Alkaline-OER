<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OER 工作台</title>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
<style>
/* ============================================================
   设计系统 — macOS 原生观感（参考 System Settings / Big Sur 之后的
   毛玻璃侧栏 + 分组列表 + 系统蓝）。字体用系统栈，在 Mac 上就是
   San Francisco，不引入任何"网页风"的自定义展示字体。
   ============================================================ */
:root{
  --bg:#f5f5f7; --card:#ffffff; --sidebar-bg:rgba(246,246,248,.78);
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.15);
  --primary:#0071e3; --primary-dark:#0058b9; --primary-soft:rgba(0,113,227,.1);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
  --accent:#ff3b30; --success:#34c759; --warn:#ff9f0a;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 14px rgba(0,0,0,.045);
  --titlebar-h:30px; /* 给 macOS 红黄绿按钮留出的可拖拽区域 */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1e; --card:#2c2c2e; --sidebar-bg:rgba(28,28,30,.78);
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.18);
    --primary:#0a84ff; --primary-dark:#409cff; --primary-soft:rgba(10,132,255,.18);
    --text:#f5f5f7; --text-2:#98989d; --text-3:#6e6e73;
    --accent:#ff453a; --success:#30d158; --warn:#ff9f0a;
    --shadow:0 1px 1px rgba(0,0,0,.16),0 4px 16px rgba(0,0,0,.28);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;height:100vh;
  text-rendering:optimizeLegibility;user-select:none}
input,textarea,.mono,.chart,table{user-select:text}
#root{height:100vh}
.app{display:flex;height:100vh;overflow:hidden}

/* ===== 左侧栏：毛玻璃 + 分组列表，仿 Finder/System Settings ===== */
.nav{width:200px;background:var(--sidebar-bg);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.titlebar-spacer{height:var(--titlebar-h);flex-shrink:0;-webkit-app-region:drag}
.brand{padding:2px 16px 14px;font-size:14px;font-weight:650;letter-spacing:-.01em;-webkit-app-region:drag}
.brand .sub{font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px}
.nav-list{padding:2px 8px}
.nav-item{padding:6px 10px;margin-bottom:1px;cursor:pointer;color:var(--text);font-size:13px;
  display:flex;align-items:center;gap:8px;border-radius:7px;transition:background .1s}
.nav-item:hover{background:rgba(0,0,0,.045)}
@media (prefers-color-scheme:dark){.nav-item:hover{background:rgba(255,255,255,.06)}}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ic{width:16px;height:16px;flex-shrink:0;opacity:.85}
.nav-item .ic svg{width:16px;height:16px;display:block}
.nav-item.active .ic{opacity:1}
.nav-foot{margin-top:auto;padding:12px 16px 16px;font-size:10.5px;color:var(--text-3);line-height:1.6;
  border-top:1px solid var(--border)}

/* ===== 主区 ===== */
.main{flex:1;overflow:auto;padding:calc(var(--titlebar-h) + 14px) 26px 26px}
.panel-title{font-size:20px;font-weight:650;letter-spacing:-.015em;margin-bottom:3px}
.panel-desc{font-size:12.5px;color:var(--text-2);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:4px}

/* 卡片：白色圆角面板，标题用大写小号灰色 eyebrow（System Settings 分组标签的味道） */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px}
.card h4{font-size:11px;font-weight:650;margin-bottom:10px;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.04em}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)}

/* 按钮：Apple 风格胶囊按钮 */
.btn{padding:6px 14px;border:none;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:590;
  transition:all .12s;line-height:1.4}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--text-3);opacity:.5;cursor:not-allowed}
.btn-ghost{background:rgba(0,0,0,.055);color:var(--text)}
@media (prefers-color-scheme:dark){.btn-ghost{background:rgba(255,255,255,.09)}}
.btn-ghost:hover{background:rgba(0,0,0,.09)}
@media (prefers-color-scheme:dark){.btn-ghost:hover{background:rgba(255,255,255,.15)}}
.btn-sm{padding:4px 10px;font-size:11.5px}

/* 分段控件（Segmented Control）：用于「严格 / 标准 / 宽松」这类互斥单选 */
.segmented{display:inline-flex;background:rgba(0,0,0,.06);border-radius:8px;padding:2px;gap:1px}
@media (prefers-color-scheme:dark){.segmented{background:rgba(255,255,255,.08)}}
.segmented button{border:none;background:transparent;padding:5px 11px;border-radius:6px;font-size:12px;
  color:var(--text-2);cursor:pointer;font-weight:500;transition:all .12s;white-space:nowrap}
.segmented button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.meta{font-size:11.5px;color:var(--text-2);line-height:1.75}
.meta strong{color:var(--text);font-weight:590}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hint{font-size:11px;color:var(--text-3);line-height:1.6}
.ok{color:var(--success)} .warn{color:var(--warn)} .err{color:var(--accent)}
.chart{height:300px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:transparent;text-align:left;padding:6px 10px;color:var(--text-3);font-weight:600;
  border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;letter-spacing:.03em}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.tip{padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;
  background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.3);color:#a15c00}
@media (prefers-color-scheme:dark){.tip{color:#ffd479}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
@media (prefers-color-scheme:dark){::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:padding-box}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API_BASE = '';
const SegmentedControl=({options,value,onChange})=>(
  <div className="segmented">
    {options.map(o=><button key={o.id} className={value===o.id?'active':''} onClick={()=>onChange(o.id)} title={o.desc}>{o.label}</button>)}
  </div>
);


/* ===================== 图表封装 ===================== */
function ChartBox({ option, height=300 }) {
  const ref=useRef(null); const inst=useRef(null);
  const optionRef=useRef(option); optionRef.current=option;
  // 首次 option 更新：容器可见则立即 init；不可见（display:none）则等 ResizeObserver
  useEffect(()=>{
    if(!ref.current) return;
    if(ref.current.offsetWidth>0&&ref.current.offsetHeight>0){
      if(!inst.current) inst.current=echarts.init(ref.current);
      inst.current.setOption(option,true);
    }
  },[option]);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const ro=new ResizeObserver(()=>{
      if(!inst.current&&el.offsetWidth>0&&el.offsetHeight>0){
        try{inst.current=echarts.init(el);inst.current.setOption(optionRef.current,true);}catch(e){}
      }else if(inst.current){inst.current.resize();}
    });
    ro.observe(el);
    return ()=>{ro.disconnect();inst.current&&inst.current.dispose();inst.current=null;};
  },[]);
  return <div ref={ref} className="chart" style={{height}}/>;
}

/* ===================== 三列数据文本解析（.txt/.csv/.dat 共用） ===================== */
// 之前 FileDropZone / handleFolder+loadLocalFile 各自内联了一份几乎相同的解析逻辑，
// 且只按空白符切分——真正的逗号分隔 .csv（扩展名已声明支持）会解析失败。
// 这里统一支持空白符、逗号、分号、Tab，并去掉表头等非数字行。
function parseTraceText(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const rows=lines.map(line=>{
    const c=line.trim().split(/[\s,;]+/).map(parseFloat);
    return [c[0],c[1],c[2]];
  }).filter(d=>d.length===3&&d.every(v=>Number.isFinite(v)));
  return rows;
}

/* ===================== 文件拖放 ===================== */
function FileDropZone({ onFileLoaded, expData }) {
  const [dragOver,setDragOver]=useState(false);
  const inputRef=useRef(null);
  const parseFile=(file)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      onFileLoaded({name:file.name,rows:parseTraceText(e.target.result)});
    };
    reader.readAsText(file);
  };
  return (<div>
    <div className="drop-zone" style={{border:'1px dashed var(--border-strong)',borderRadius:10,padding:'18px 12px',textAlign:'center',
      cursor:'pointer',background:dragOver?'var(--primary-soft)':expData?'rgba(52,199,89,.1)':'var(--bg)',transition:'all .12s'}}
      onDrop={e=>{e.preventDefault();setDragOver(false);if(e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0]);}}
      onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
      onClick={()=>inputRef.current?.click()}>
      <div style={{fontSize:13}}>{expData?`✅ ${expData.name}`:'拖放数据文件，或点击选择'}</div>
      {expData&&<div className="meta" style={{marginTop:4}}>{expData.rows.length.toLocaleString()} 个数据点</div>}
    </div>
    <input ref={inputRef} type="file" accept=".txt,.csv,.dat" style={{display:'none'}}
      onChange={e=>{if(e.target.files[0])parseFile(e.target.files[0]);}}/>
  </div>);
}

/* ===================== 参数面板（折叠） ===================== */
const PARAM_GROUPS=[
  {title:'热力学描述符',params:[
    {key:'G_OH',label:'G_OH',unit:'eV'},{key:'G_O',label:'G_O',unit:'eV'},{key:'scaling_OOH_OH',label:'scaling_OOH_OH',unit:'eV'}]},
  {title:'预氧化',params:[{key:'E0_pre',label:'E0_pre',unit:'V'},{key:'k0_pre',label:'k0_pre',unit:'s⁻¹'}]},
  {title:'AEM 动力学',params:[
    {key:'k0_1',label:'k0_1',unit:'s⁻¹'},{key:'k0_2',label:'k0_2',unit:'s⁻¹'},
    {key:'k0_3',label:'k0_3',unit:'s⁻¹'},{key:'k0_4',label:'k0_4',unit:'s⁻¹'}]},
  {title:'扫描',params:[
    {key:'E_start',label:'E_start',unit:'V'},{key:'E_end',label:'E_end',unit:'V'},
    {key:'f',label:'f',unit:'Hz'},{key:'dE',label:'dE',unit:'V'},{key:'n_points',label:'n_points',unit:''}]},
  {title:'电极与电路',params:[
    {key:'Ru',label:'Ru',unit:'Ω'},{key:'Cdl',label:'Cdl',unit:'F/cm²'},{key:'A',label:'A',unit:'cm²'},
    {key:'gamma',label:'gamma',unit:'mol/cm²'},{key:'T',label:'T',unit:'K'},{key:'a',label:'a',unit:''}]},
];
function ParamPanel({params,onChange}) {
  const h=(k,v)=>onChange({...params,[k]:parseFloat(v)||0});
  return PARAM_GROUPS.map(g=>(
    <div key={g.title} style={{marginBottom:8}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--primary)',margin:'8px 0 4px'}}>{g.title}</div>
      {g.params.map(p=>(<div key={p.key} style={{display:'flex',alignItems:'center',margin:'3px 0'}}>
        <span style={{width:96,flexShrink:0,fontSize:12,color:'var(--text-2)'}}>{p.label}</span>
        <input className="mono" type="number" step={p.step||0.01} value={params[p.key]??''}
          onChange={e=>h(p.key,e.target.value)}
          style={{flex:1,padding:'4px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12,background:'var(--bg)',color:'var(--text)'}}/>
        <span style={{width:44,fontSize:11,color:'var(--text-3)',paddingLeft:6}}>{p.unit}</span>
      </div>))}
    </div>));
}

const AEM_PARAM_BOUNDS={k0_1:[1e-2,1e4],k0_2:[1e-2,1e4],k0_3:[1e-2,1e4],k0_4:[1e-2,1e4],
  G_OH:[0.9,1.7],G_O:[2.3,3.3],scaling_OOH_OH:[2.9,3.5],gamma:[1e-10,1e-7]};
function formatHarmonics(list){if(!list||!list.length)return '无，仅 DC';return list.map(h=>`H${h}`).join(', ');}
// 降采样：均匀抽取 maxN 个点，避免 ECharts 渲染几十万点导致白屏
function downsample(arr,maxN=500){
  if(!arr||!arr.length)return [];
  if(arr.length<=maxN)return arr.slice();
  const step=arr.length/maxN;
  const out=[];
  for(let i=0;i<maxN;i++)out.push(arr[Math.floor(i*step)]);
  out.push(arr[arr.length-1]);
  return out;
}
function downsampleXY(x,y,maxN=500){
  if(!x||!y)return{x:[],y:[]};
  if(x.length<=maxN)return{x,y};
  const step=x.length/maxN; const ox=[],oy=[];
  for(let i=0;i<maxN;i++){const k=Math.floor(i*step);ox.push(x[k]);oy.push(y[k]);}
  ox.push(x[x.length-1]);oy.push(y[y.length-1]);
  return{x:ox,y:oy};
}
// 旧版 Web 图表辅助：坐标对 + 单条线 + 实验虚线
const MODEL_COLOR='#0071e3';
function pairs(x,y,maxN=800){if(!x||!y)return[];const d=downsampleXY(x,y,maxN);return d.y.map((v,i)=>[+d.x[i].toFixed(5),+v.toExponential(6)]);}
function singleLine(data,color,label){return{name:label,type:'line',showSymbol:false,smooth:true,lineStyle:{width:1.5,color},data};}
function expLine(data){return{name:'实验',type:'line',showSymbol:false,smooth:true,lineStyle:{width:1.2,type:'dashed',color:'#ff453a'},data};}
function makeOpt({xName,yName,series,yOpt={},legend=false}){
  return{tooltip:{trigger:'axis',confine:true},
    legend:legend?{top:0,itemWidth:14,itemHeight:8,textStyle:{fontSize:9},type:'scroll'}:undefined,
    grid:{top:legend?34:20,right:20,bottom:40,left:62},
    xAxis:{type:'value',name:xName,nameLocation:'middle',nameGap:30,axisLabel:{fontSize:9},scale:true},
    yAxis:Object.assign({type:'value',axisLabel:{fontSize:9,formatter:v=>+v.toExponential(1)},name:yName},yOpt),
    series};
}

/* ===================== ① 样品与电极常量 ===================== */
// 注：原先这里还有一个独立的 <SampleStep> 组件，但 App 的导航只有「数据与正演」
// 「项目结果」两步，样品信息实际是作为可折叠面板嵌在 WorkStep 里的（见下方
// sampleOpen 部分）。SampleStep 从未被渲染，属于死代码，已删除；如果之后想把
// 「样品与电极」独立成第一步，可以把这段折叠面板的 JSX 抽出来重新做成组件。
const CATALYST='四氧化三钴（Co₃O₄）';
const SUPPORTS=['钛毡','钛箔'];
const REFERENCES=['Ag/AgCl（饱和 KCl）','Hg/HgO（1 M KOH）','可逆氢电极 RHE'];

/* ===================== ② 数据与正演（合并） ===================== */
const STRICTNESS=[
  {id:'loose',label:'宽松',desc:'允许更低信噪比的高阶谐波进入建议'},
  {id:'standard',label:'标准',desc:'按默认可解析性阈值建议'},
  {id:'strict',label:'严格',desc:'只保留信噪比很高的谐波'},
];
function WorkStep({expData,setExpData,expAnalysis,setExpAnalysis,setError,strictness,setStrictness,sample,setSample}) {
  const [localFiles,setLocalFiles]=useState([]); const [localSel,setLocalSel]=useState('');
  const [sampleOpen,setSampleOpen]=useState(false);
  const sf=(k,v)=>setSample&&setSample(s=>({...s,[k]:v}));
  const dirRef=useRef(null);
  const [params,setParams]=useState({}); const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null); const [advOpen,setAdvOpen]=useState(false);
  const [invTrials,setInvTrials]=useState(10); const [invLoading,setInvLoading]=useState(false);
  const [invResult,setInvResult]=useState(null); const [invError,setInvError]=useState(null);
  const [invHistory,setInvHistory]=useState([]); // 同一次数据的累积收敛历史
  const [simJob,setSimJob]=useState(null);   // 正演任务 job_id（轮询/取消）
  const [invJob,setInvJob]=useState(null);   // 反演任务 job_id（轮询/取消）
  useEffect(()=>{fetch(`${API_BASE}/api/params/defaults`).then(r=>r.json()).then(setParams).catch(()=>{});},[]);
  const handleFile=async(d)=>{
    setExpData(d);setExpAnalysis(null);
    try{
      // strictness 一并发给后端：阈值应由科学侧代码/配置决定，前端只负责传递选择，
      // 不再自行发明一套独立的判定逻辑（见下方 suggested() 的兼容性说明）。
      const res=await fetch(`${API_BASE}/api/data/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:d.rows,strictness})});
      const data=await res.json();if(!data.success)setError('数据解析失败: '+data.error);else setExpAnalysis(data);
    }catch(e){setError('数据解析失败: '+e.message);}
  };
  // 严格程度切换后，用同一份已加载数据重新请求后端判定（而不是仅在前端改阈值）。
  // 若后端暂未按 strictness 重算，返回内容不变，suggested() 的前端兜底阈值会继续生效。
  useEffect(()=>{ if(expData&&expData.rows&&expData.rows.length) handleFile(expData); },[strictness]);
  const handleFolder=(e)=>{
    const files=Array.from(e.target.files||[]);
    const txt=files.filter(f=>/\.(txt|csv|dat)$/i.test(f.name));
    if(txt.length){setLocalFiles(txt);setLocalSel(txt[0].name);}else{setError('文件夹中没有 .txt/.csv/.dat 文件');}
    e.target.value='';
  };
  const loadLocalFile=async()=>{
    const f=localFiles.find(x=>x.name===localSel);
    if(!f)return;
    setExpData({name:f.name});setExpAnalysis(null);setError(null);
    try{
      const text=await f.text();
      const rows=parseTraceText(text);
      if(rows.length<1024)throw new Error('有效数据点不足 1024');
      await handleFile({name:f.name,rows});
    }catch(e){setError('本地数据解析失败: '+e.message);}
  };
  const suggested=()=>{
    if(!expAnalysis) return [];
    const hq=expAnalysis.harmonic_quality;
    if(!hq) return expAnalysis.suggested_fit_harmonics||[];
    // 优先用后端按当前 strictness 返回的 fit_harmonics（见 handleFile 里的 strictness 传参）。
    // 下面的 0.03/0.003 只是后端尚未针对 strict/loose 返回专门判定时的前端兜底，
    // 不是正式判据；一旦后端 analyze_ftacv_trace 按 strictness 返回结果，这里应删除兜底分支。
    if(strictness==='standard') return hq.fit_harmonics||[];
    const th=strictness==='strict'?0.03:0.003;
    return (hq.channels||[]).filter(c=>c.relative_rms>=th).map(c=>c.harmonic);
  };
  const sug=suggested();
  const hqChannels=(expAnalysis&&expAnalysis.harmonic_quality&&expAnalysis.harmonic_quality.channels)||[];
  // 轮询工具：提交后轮询 /api/jobs/{id} 直到终态
  const pollJob=async(jobId,maxSec=600)=>{
    for(let i=0;i<maxSec*2;i++){
      await new Promise(r=>setTimeout(r,500));
      const s=await fetch(`${API_BASE}/api/jobs/${jobId}`).then(x=>x.json());
      if(s.status==='done') return {status:'done', result:s.result};
      if(s.status==='failed') return {status:'failed', error:s.error||'任务失败'};
      if(s.status==='canceled') return {status:'canceled'};
    }
    return {status:'timeout'};
  };
  const simulate=async()=>{
    setLoading(true);setError(null);setSimJob(null);
    try{
      const res=await fetch(`${API_BASE}/api/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...params})});
      if(!res.ok){setError(`正演请求失败：HTTP ${res.status}`);setLoading(false);return;}
      const jd=await res.json();
      if(!jd.success){setError(jd.error||'提交失败');setLoading(false);return;}
      setSimJob(jd.job_id);
      const fin=await pollJob(jd.job_id);
      if(fin.status==='done'&&fin.result&&fin.result.success){fin.result.source='manual';setResult(fin.result);}
      else if(fin.status==='done') setError((fin.result&&fin.result.error)||'正演失败');
      else setError(fin.error||(fin.status==='canceled'?'正演已取消':'正演超时'));
    }catch(e){setError(e.message);}
    setLoading(false);setSimJob(null);
  };
  const cancelSimulate=async()=>{
    if(simJob){try{await fetch(`${API_BASE}/api/jobs/${simJob}/cancel`,{method:'POST'});}catch(e){}}
    setLoading(false);setSimJob(null);setError('正演已取消');
  };
  const cancelInversion=()=>{
    if(invJob){fetch(`${API_BASE}/api/jobs/${invJob}/cancel`,{method:'POST'}).catch(()=>{});}
    setInvLoading(false);setInvJob(null);setInvError('已取消反演');
  };
  const runInversion=async()=>{
    if(!expAnalysis){setInvError('请先导入数据');return;}
    setInvLoading(true);setInvError(null);setInvResult(null);setInvJob(null);
    try{
      const m=expAnalysis.meta;
      // 拟合通道用科学侧建议（而非硬编码 H1-H3）
      const fit=(expAnalysis.harmonic_quality&&expAnalysis.harmonic_quality.fit_harmonics)||expAnalysis.suggested_fit_harmonics||[1,2,3];
      const tafelOk=!!(expAnalysis.calib&&expAnalysis.calib.tafel&&expAnalysis.calib.tafel.success);
      const payload={
        target:{tdc:expAnalysis.tdc,dc:expAnalysis.dc,harmonics:expAnalysis.harmonics,tafel:tafelOk?expAnalysis.calib.tafel.tafel_slope:null},
        config:{E_start:m.E_start,E_end:m.E_end,f:m.f,dE:m.dE,n_points:512,points_per_cycle:64,feature_grid_size:64},
        initial_params:{k0_1:params.k0_1,k0_2:params.k0_2,k0_3:params.k0_3,k0_4:params.k0_4,
          G_OH:params.G_OH,G_O:params.G_O,scaling_OOH_OH:params.scaling_OOH_OH,gamma:params.gamma},
        fixed_params:{Cdl:params.Cdl,Ru:params.Ru,A:params.A,E0_pre:params.E0_pre,k0_pre:params.k0_pre},
        param_bounds:AEM_PARAM_BOUNDS,fit_harmonics:fit,n_trials:invTrials,
      };
      const res=await fetch(`${API_BASE}/api/inversion/tpe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok){setInvError(`反演请求失败：HTTP ${res.status}`);setInvLoading(false);return;}
      const jd=await res.json();
      if(!jd.success){setInvError(jd.error||'提交失败');setInvLoading(false);return;}
      setInvJob(jd.job_id);
      const fin=await pollJob(jd.job_id,1800); // 反演长任务，允许更久
      setInvJob(null);
      if(fin.status==='canceled'){setInvError('反演已取消');setInvLoading(false);return;}
      if(fin.status!=='done'){setInvError(fin.error||'反演超时');setInvLoading(false);return;}
      const data=fin.result;
      if(!data.success){setInvError(data.error||'反演失败');setInvLoading(false);return;}
      setInvResult(data);
      // 收敛历史累积：同一次数据的多次反演追加到同一曲线
      if(data.history&&data.history.length){
        setInvHistory(prev=>{
          const offset=prev.length;
          let runningBest=prev.length?prev[prev.length-1].best:Infinity;
          const added=data.history.map(item=>{
            const v=Number(item.value);
            if(v<runningBest) runningBest=v;
            return {trial:offset+Number(item.trial||0), value:v, best:runningBest};
          });
          return [...prev,...added];
        });
      }
      // 反演结果更新到参数表 → 支持连续反演；同步实验扫描参数保证正演一致
      setParams(p=>({...p,...data.best_params,
        E_start:+m.E_start.toFixed(4),E_end:+m.E_end.toFixed(4),f:+m.f.toFixed(4),dE:+m.dE.toFixed(4)}));
      // 反演完成后用 best_params 正演（提交+轮询），右栏图实时更新
      const simParams={...params,...data.best_params,E_start:m.E_start,E_end:m.E_end,f:m.f,dE:m.dE,n_points:512,points_per_cycle:64};
      const sr=await fetch(`${API_BASE}/api/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(simParams)});
      const sjd=await sr.json();
      if(sjd.success){
        const sf=await pollJob(sjd.job_id);
        if(sf.status==='done'&&sf.result&&sf.result.success){sf.result.source='inversion';setResult(sf.result);}
        else setError('反演参数正演失败');
      } else setError('反演参数正演提交失败');
    }catch(e){setInvError(e.message);}
    setInvLoading(false);
  };

  // 判断参数是否顶到边界（→ 可能未分辨），并给出原因
  const markParam=(k,v)=>{
    const b=AEM_PARAM_BOUNDS[k];
    if(!b) return null;
    const [lo,hi]=b; const norm=(Number(v)-lo)/(hi-lo);
    if(norm<0.02) return '顶下边界·可能未分辨';
    if(norm>0.98) return '顶上边界·可能未分辨';
    return null;
  };
  // 反演收敛历史（跨多次反演累积：loss 散点 + running best 实线）
  const invHistOpt=()=>{
    if(!invHistory.length) return null;
    return {tooltip:{trigger:'axis'},legend:{top:0,itemWidth:14,itemHeight:8,textStyle:{fontSize:9}},grid:{top:24,right:16,bottom:30,left:56},
      xAxis:{type:'value',name:'trial',nameLocation:'middle',nameGap:26,axisLabel:{fontSize:9}},
      yAxis:{type:'value',scale:true,axisLabel:{fontSize:9,formatter:v=>+v.toExponential(1)},name:'loss'},
      series:[
        {name:'loss',type:'scatter',symbolSize:4,color:'#9aa2b0',data:invHistory.map(h=>[h.trial,+h.value.toExponential(6)])},
        {name:'best',type:'line',showSymbol:false,smooth:true,color:'#1677ff',data:invHistory.map(h=>[h.trial,+h.best.toExponential(6)])},
      ]};
  };
  const exportMd=()=>{
    const s=[]; const now=new Date().toISOString().slice(0,19).replace('T',' ');
    s.push('# OER-FTAcV 分析报告');s.push('');s.push(`> 生成时间：${now}（本地）`);
    s.push('');s.push('## 1. 样品与电极');s.push('');
    s.push('| 项 | 值 |');s.push('|---|---|');
    s.push('| 催化剂 | 四氧化三钴（Co₃O₄） |');
    s.push(`| 基底 | ${sample&&sample.support?sample.support:'未填'} |`);
    s.push(`| 面积 | ${sample&&sample.area?`${sample.area} cm²`:'未填'} |`);
    s.push(`| 参比电极 | ${sample&&sample.reference?sample.reference:'未填'} |`);
    s.push(`| 电解液 | ${sample&&sample.electrolyte?sample.electrolyte:'未填'} |`);
    s.push(`| 备注 | ${sample&&sample.note?sample.note:'无'} |`);
    if(expAnalysis){const m=expAnalysis.meta;
      s.push('');s.push('## 2. 数据识别');s.push('');
      s.push('| 项 | 值 |');s.push('|---|---|');
      s.push(`| 频率 | ${m.f.toFixed(3)} Hz |`);s.push(`| 振幅 | ${m.dE.toFixed(3)} V |`);
      s.push(`| 扫速 | ${(m.v*1000).toFixed(1)} mV/s |`);s.push(`| 电位窗 | ${m.E_start.toFixed(3)} → ${m.E_end.toFixed(3)} V |`);
    }
    if(invResult){s.push('');s.push('## 3. 诊断反演（口径：诊断性拟合，非正式结论）');s.push('');
      s.push(`- 目标值：**${invResult.best_value.toFixed(4)}** · trials：${invResult.n_trials} · nfev：${invResult.n_forward}`);
      s.push(`- 拟合等级：${invResult.fit_quality.level} · 完成度 ${invResult.fit_quality.completion_percent.toFixed(1)}%`);
      s.push('- 拟合通道：'+formatHarmonics(invResult.fit_harmonics));
      s.push('');s.push('### 参数');s.push('');s.push('| 参数 | 值 |');s.push('|---|---|');
      Object.entries(invResult.best_params||{}).forEach(([k,v])=>s.push(`| ${k} | ${+v.toExponential(4)} |`));
    }
    s.push('');s.push('## 4. 限制说明');s.push('');
    s.push('- 本报告为**诊断口径**，不构成正式参数点估计或机理结论。');
    s.push('- 参数可识别性与补偿关系见项目 A6 分析；真实反演需满足冻结 Gate。');
    s.push('');s.push('---');s.push('*由 OER 工作台生成*');
    const blob=new Blob([s.join('\n')],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`oer-report-${now.slice(0,10)}.md`;a.click();
  };
  // ===== 右栏图表（旧版布局：总电流 / 功率谱 / 覆盖度 / DC / 各阶谐波）=====
  const modelLabel=result&&result.source==='inversion'?'反演参数正演':'正演';
  const E=result?result.E_actual:null; const tdc=result?result.tdc:null;
  const expTdc=expAnalysis?expAnalysis.tdc:null;
  // 总电流
  const cvSeries=[];
  if(result) cvSeries.push(singleLine(pairs(E,result.i_total,800),MODEL_COLOR,modelLabel));
  if(expAnalysis&&expAnalysis.E_raw&&expAnalysis.i_raw) cvSeries.push(expLine(pairs(expAnalysis.E_raw,expAnalysis.i_raw,800)));
  const cvOpt=cvSeries.length?makeOpt({xName:'电位 (V vs RHE)',yName:'i (A)',series:cvSeries,legend:true}):null;
  // 功率谱
  const psSeries=result?[{name:'功率谱',type:'line',showSymbol:false,smooth:true,data:(result.ps_freq||[]).map((f,i)=>[+f.toFixed(3),+result.ps_mag[i].toExponential(4)])}]:[];
  const psOpt=psSeries.length?makeOpt({xName:'频率 (Hz)',yName:'|FFT|',series:psSeries}):null;
  // 覆盖度
  const covSeries=result?[
    singleLine(pairs(E,result.coverage_star),MODEL_COLOR,'θ_*'),
    singleLine(pairs(E,result.coverage_ox),'#af52de','θ_*ox'),
    singleLine(pairs(E,result.coverage_OH),'#64d2ff','θ_*ox-OH'),
    singleLine(pairs(E,result.coverage_O),'#ff9500','θ_*ox-O'),
    singleLine(pairs(E,result.coverage_OOH),'#34c759','θ_*ox-OOH'),
  ]:[];
  const covOpt=covSeries.length?makeOpt({xName:'电位 (V vs RHE)',yName:'Coverage',series:covSeries,yOpt:{max:1,min:0},legend:true}):null;
  // DC 分量
  const dcSeries=[];
  if(result) dcSeries.push(singleLine(pairs(tdc,result.dc,800),MODEL_COLOR,modelLabel));
  if(expAnalysis&&expAnalysis.dc) dcSeries.push(expLine(pairs(expTdc,expAnalysis.dc,800)));
  const dcOpt=dcSeries.length?makeOpt({xName:'电位 (V vs RHE)',yName:'归一化强度',series:dcSeries,legend:true}):null;
  // 各阶谐波
  const hOpts=(result||expAnalysis)?[0,1,2,3,4,5,6].map(k=>{
    const series=[];
    if(result) series.push(singleLine(pairs(tdc,result.harmonics[k],800),MODEL_COLOR,modelLabel));
    if(expAnalysis&&expAnalysis.harmonics) series.push(expLine(pairs(expTdc,expAnalysis.harmonics[k],800)));
    const active=expAnalysis?((expAnalysis.harmonic_quality&&expAnalysis.harmonic_quality.fit_harmonics||expAnalysis.suggested_fit_harmonics||[]).includes(k+1)):true;
    return series.length?{opt:makeOpt({xName:'电位 (V vs RHE)',yName:'归一化强度',series,legend:true}),label:`H${k+1}${active?' · 拟合':' · 诊断'}`}:null;
  }):[];
  return (<div className="main" style={{display:'flex',gap:14,alignItems:'flex-start'}}>
    <div className="left-panel" style={{width:340,flexShrink:0,padding:16,background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflowY:'auto'}}>
      <div className="panel-title">数据与正演</div>
      {/* 样品与电极（折叠小卡，随报告导出） */}
      <div style={{marginBottom:10}}>
        <button className="btn btn-ghost btn-sm" style={{width:'100%',textAlign:'left'}} onClick={()=>setSampleOpen(!sampleOpen)}>
          {sampleOpen?'▾':'▸'} 样品与电极 {sample&&sample.area?`· ${sample.support||''} ${sample.area}cm²`:'（可折叠）'}
        </button>
        {sampleOpen&&<div style={{marginTop:8}}>
          <div className="field"><label>基底</label>
            <select value={sample.support||''} onChange={e=>sf('support',e.target.value)}>
              <option value="">请选择</option>{SUPPORTS.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div className="field"><label>电极面积（cm²）</label>
            <input type="number" value={sample.area??''} onChange={e=>sf('area',e.target.value)} placeholder="例如 0.196"/></div>
          <div className="field"><label>参比电极</label>
            <select value={sample.reference||''} onChange={e=>sf('reference',e.target.value)}>
              <option value="">请选择</option>{REFERENCES.map(r=><option key={r} value={r}>{r}</option>)}
            </select></div>
          <div className="field"><label>电解液</label>
            <input value={sample.electrolyte||''} onChange={e=>sf('electrolyte',e.target.value)} placeholder="例如 1 M KOH"/></div>
          <div className="field"><label>备注</label>
            <textarea value={sample.note||''} onChange={e=>sf('note',e.target.value)} rows={1}
              style={{width:'100%',padding:'6px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12,resize:'vertical'}}/></div>
        </div>}
      </div>
      <div className="card" style={{padding:0,border:'none',boxShadow:'none'}}>
        <h4>导入数据</h4>
        <FileDropZone onFileLoaded={handleFile} expData={expData}/>
        <div className="row" style={{marginTop:10}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>dirRef.current&&dirRef.current.click()}>📁 选择本地数据文件夹</button>
          <input ref={dirRef} type="file" webkitdirectory="" multiple style={{display:'none'}} onChange={handleFolder}/>
        </div>
        {localFiles.length>0&&<div className="row" style={{marginTop:8}}>
          <select value={localSel} onChange={e=>setLocalSel(e.target.value)} style={{flex:1,padding:'6px 8px',border:'1px solid var(--border-strong)',borderRadius:7,fontSize:12}}>
            {localFiles.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
          </select>
          <button className="btn btn-ghost btn-sm" onClick={loadLocalFile}>加载</button>
        </div>}
      </div>
      {expAnalysis&&(<div className="card" style={{padding:0,border:'none',boxShadow:'none'}}>
        <h4>自动识别</h4>
        <div className="meta" style={{lineHeight:2}}>
          频率：<strong>{expAnalysis.meta.f.toFixed(2)} Hz</strong> · 振幅：<strong>{expAnalysis.meta.dE.toFixed(3)} V</strong><br/>
          扫速：<strong>{(expAnalysis.meta.v*1000).toFixed(1)} mV/s</strong> · 范围：<strong>{expAnalysis.meta.E_start.toFixed(3)}→{expAnalysis.meta.E_end.toFixed(3)} V</strong><br/>
          周期数：<strong>{Math.round(expAnalysis.meta.f*expAnalysis.meta.duration)}</strong>
          {expAnalysis.calib&&expAnalysis.calib.cdl.success&&<><br/>Cdl·A：<strong>{(expAnalysis.calib.cdl.CdlA*1e6).toFixed(1)} µF</strong>{expAnalysis.calib.tafel.success&&` · Tafel ${expAnalysis.calib.tafel.tafel_slope_mV.toFixed(0)} mV/dec`}</>}
          {expAnalysis.calib&&<><br/>预氧化峰：<strong>{expAnalysis.calib.preox.separable?'直流可见（定量需反演）':'与 OER 重叠，不可直流分离'}</strong></>}
        </div>
      </div>)}
      {expAnalysis&&(<div className="card" style={{padding:0,border:'none',boxShadow:'none'}}>
        <h4>谐波质量</h4>
        <div className="field"><label>判断严格程度</label>
          <SegmentedControl options={STRICTNESS} value={strictness} onChange={setStrictness}/></div>
        <div className="meta" style={{marginTop:8}}>
          建议分析用到第 <strong style={{fontSize:16}}>{sug.length?`H${sug[sug.length-1]}`:'无'}</strong> 阶谐波
          {sug.length?`（${formatHarmonics(sug)}）`:''}
        </div>
        {hqChannels.length>0&&<table style={{marginTop:8}}>
          <thead><tr><th>阶</th><th>相对 H1</th><th>判定</th></tr></thead>
          <tbody>{hqChannels.map(c=><tr key={c.harmonic}>
            <td>H{c.harmonic}</td><td>{(c.relative_rms*100).toFixed(1)}%</td>
            <td className={c.fit?'ok':'warn'}>{c.fit?'可拟合':'仅诊断'}</td></tr>)}</tbody></table>}
      </div>)}
      <div className="card" style={{padding:0,border:'none',boxShadow:'none',borderTop:'1px dashed var(--border)',paddingTop:12,marginTop:12}}>
        <h4>正演与反演</h4>
        <div className="row" style={{marginTop:0}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setAdvOpen(!advOpen)}>{advOpen?'收起参数':'展开参数（高级）'}</button>
          {expAnalysis&&<button className="btn btn-ghost btn-sm" onClick={()=>{const m=expAnalysis.meta;setParams(p=>({...p,E_start:+m.E_start.toFixed(4),E_end:+m.E_end.toFixed(4),f:+m.f.toFixed(4),dE:+m.dE.toFixed(4),n_points:16384}));}}>同步扫描参数</button>}
        </div>
        {advOpen&&<ParamPanel params={params} onChange={setParams}/>}
        <div className="row" style={{marginTop:12,width:'100%'}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={simulate} disabled={loading}>
            {loading?'正演中...':'▶ 运行当前参数正演'}</button>
          {loading&&<button className="btn btn-ghost btn-sm" onClick={cancelSimulate}>取消</button>}
        </div>
        <div className="row" style={{marginTop:14}}>
          <span className="meta">trials</span>
          <input type="number" min="1" max="200" value={invTrials} onChange={e=>setInvTrials(Math.max(1,parseInt(e.target.value)||1))}
            style={{width:70,padding:'5px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12}}/>
        </div>
        <div className="row" style={{marginTop:8,gap:8}}>
          <button className="btn btn-primary" style={{flex:1,background:'var(--warn)'}} onClick={runInversion} disabled={invLoading}>
            {invLoading?'反演中...':'启动诊断反演'}</button>
          {invLoading&&<button className="btn btn-ghost btn-sm" onClick={cancelInversion}>取消</button>}
        </div>
        {expAnalysis&&expAnalysis.calib&&expAnalysis.calib.tafel&&!expAnalysis.calib.tafel.success&&
          <div className="tip" style={{marginTop:10}}>Tafel 提取失败：本次反演不含 Tafel 通道，仅用 DC+谐波。</div>}
        {!expAnalysis&&<div className="hint" style={{marginTop:10}}>需先导入数据才能反演。</div>}
        {invError&&<div className="err meta" style={{marginTop:10}}>反演错误：{invError}</div>}
        {invResult&&<div className="meta" style={{marginTop:10}}>
          目标：<strong>{invResult.best_value.toFixed(4)}</strong> · 等级：<strong>{invResult.fit_quality.level}</strong>
          · 完成度 <strong>{invResult.fit_quality.completion_percent.toFixed(1)}%</strong><br/>
          通道：{formatHarmonics(invResult.fit_harmonics)} · nfev：{invResult.n_forward} · ODE fail：{invResult.n_ode_fail||0}
        </div>}
        {invResult&&invResult.best_params&&(<div>
          <table style={{marginTop:8,fontSize:11}}>
            <thead><tr><th>参数</th><th>反演值</th><th>状态</th></tr></thead>
            <tbody>{Object.entries(invResult.best_params).map(([k,v])=>{const w=markParam(k,v);
              return <tr key={k}><td>{k}</td><td className="mono">{Number(v).toExponential(3)}</td>
                <td className={w?'warn':'ok'} style={{fontSize:10}}>{w||'正常'}</td></tr>;})}</tbody>
          </table>
          <div className="hint" style={{marginTop:4}}>「顶边界」表示该参数被优化器推到边界，可能未被数据分辨（需收紧边界或独立约束）。</div>
        </div>)}
        {invHistory.length>0&&(
          <div style={{marginTop:8}}><div className="hint" style={{marginBottom:2}}>收敛历史（{invHistory.length} trials · 同一次数据累积）</div>
            <ChartBox option={invHistOpt()} height={160}/></div>)}
        <div className="row" style={{marginTop:12}}>
          <button className="btn btn-ghost btn-sm" onClick={exportMd}>⬇ 导出 Markdown</button>
        </div>
      </div>
    </div>
    <div style={{flex:1,minWidth:0,display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:12,alignContent:'start'}}>
      <div className="card"><h4>FTacV 总电流：实验 / 正演对比</h4>
        {cvOpt?<ChartBox option={cvOpt} height={280}/>:<div className="hint" style={{padding:'30px 0',textAlign:'center'}}>导入数据并运行正演后对比</div>}</div>
      <div className="card"><h4>功率谱 (FFT)</h4>
        {psOpt?<ChartBox option={psOpt} height={280}/>:<div className="hint" style={{padding:'30px 0',textAlign:'center'}}>运行正演后显示</div>}</div>
      <div className="card"><h4>OER 表面覆盖度</h4>
        {covOpt?<ChartBox option={covOpt} height={280}/>:<div className="hint" style={{padding:'30px 0',textAlign:'center'}}>运行正演后显示</div>}</div>
      <div className="card"><h4>DC 分量</h4>
        {dcOpt?<ChartBox option={dcOpt} height={280}/>:<div className="hint" style={{padding:'30px 0',textAlign:'center'}}>导入数据后对比 DC</div>}</div>
      {hOpts.map((h,k)=>h&&(<div className="card" key={k}><h4>谐波 {h.label}</h4>
        <ChartBox option={h.opt} height={260}/></div>))}
    </div>
  </div>);
}

/* ===================== ④ 项目结果 ===================== */
function ResultsStep({setError}) {
  const [data,setData]=useState(null);
  const [profileSel,setProfileSel]=useState('hybrid__G_OH__G_O');
  const [wfSel,setWfSel]=useState(null);
  const [wfSpecs,setWfSpecs]=useState([]);
  const [wfSpec,setWfSpec]=useState('');
  const [wfStage,setWfStage]=useState('smoke');
  const [wfSubmitting,setWfSubmitting]=useState(false);
  const [wfSubmitResult,setWfSubmitResult]=useState(null);
  const loadWfDetail=async(commit,task)=>{
    setWfSel({commit,task,loading:true});
    try{
      const r=await fetch(`${API_BASE}/api/wf/task?commit=${commit}&task=${encodeURIComponent(task)}`).then(x=>x.json());
      setWfSel({commit,task,data:r});
    }catch(e){setWfSel({commit,task,error:String(e)});}
  };
  const submitWf=async()=>{
    if(!wfSpec){setError('请选择 task spec');return;}
    setWfSubmitting(true);setWfSubmitResult(null);setError(null);
    try{
      const r=await fetch(`${API_BASE}/api/wf/submit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:wfSpec,stage:wfStage})});
      const d=await r.json();
      setWfSubmitResult(d);
      if(!d.success)setError(d.error||'提交失败');
    }catch(e){setError('提交失败: '+e.message);}
    setWfSubmitting(false);
  };
  useEffect(()=>{
    Promise.all([
      fetch(`${API_BASE}/api/results/data-quality`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/sensitivity`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/recovery-s1`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/sensitivity-matrix`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/coupling`).then(r=>r.json()),
      fetch(`${API_BASE}/api/results/synthetic-recovery`).then(r=>r.json()),
      fetch(`${API_BASE}/api/wf/tasks`).then(r=>r.json()),
      fetch(`${API_BASE}/api/wf/specs`).then(r=>r.json()),
    ]).then(([dq,sens,s1,matrix,coupling,synth,wf,specs])=>{
      setData({dq,sens,s1,matrix,coupling,synth,wf,p2d:null,wfDetail:null});
      if(specs&&specs.success&&specs.specs.length){setWfSpecs(specs.specs);setWfSpec(specs.specs[0]);}
    }).catch(e=>setError(String(e)));
  },[]);
  useEffect(()=>{if(!profileSel)return;fetch(`${API_BASE}/api/results/profile2d?profile=${encodeURIComponent(profileSel)}`)
    .then(r=>r.json()).then(d=>setData(p=>p?{...p,p2d:d}:p)).catch(()=>{});},[profileSel]);
  if(!data)return <div className="panel-title">项目结果</div>;
  const heatOpt=()=>{
    if(!data.p2d||!data.p2d.heat)return null;
    const{xs,ys,points}=data.p2d.heat;
    const xi=Object.fromEntries(xs.map((x,i)=>[x,i])); const yi=Object.fromEntries(ys.map((y,i)=>[y,i]));
    const vals=points.map(p=>[xi[String(p.x)],yi[String(p.y)],Math.log10(p.loss+1e-9)]);
    const prof=data.p2d.summaries.find(s=>s.profile_id===profileSel)||{};
    return{tooltip:{position:'top',formatter:p=>{const d=points[p.dataIndex];return d?`x=${d.x.toFixed(3)} y=${d.y.toFixed(3)}<br/>loss=${d.loss.toFixed(4)}`:'-';}},
      grid:{top:26,right:24,bottom:64,left:60},
      xAxis:{type:'category',data:xs.map(x=>({value:x,textStyle:{fontSize:9}})),axisLabel:{rotate:45,fontSize:9},name:prof.x_param||'x',nameLocation:'middle',nameGap:36},
      yAxis:{type:'category',data:ys.map(y=>({value:y,textStyle:{fontSize:9}})),axisLabel:{fontSize:9},name:prof.y_param||'y',nameLocation:'middle',nameGap:34},
      visualMap:{min:Math.min(...vals.map(v=>v[2])),max:Math.max(...vals.map(v=>v[2])),orient:'horizontal',left:'center',bottom:0,textStyle:{fontSize:9},inRange:{color:['#1a9641','#f7fbff','#d7191c']}},
      series:[{type:'heatmap',data:vals}]};
  };
  const ho=heatOpt();
  const matrixOpt=()=>{
    const m=data.matrix;
    if(!m||!m.success)return null;
    const vals=[];
    m.rows.forEach((r,fi)=>{m.params.forEach((p,ci)=>{
      const v=parseFloat(r[p]||0); vals.push([ci,fi,v>0?Math.log10(v):-6]);});});
    return {tooltip:{position:'top',formatter:p=>{const v=Math.pow(10,p.value[2]);
      return `${m.features[p.value[1]]}<br/>${m.params[p.value[0]]} = ${v.toExponential(2)}`;}},
      grid:{top:10,right:16,bottom:60,left:96},
      xAxis:{type:'category',data:m.params.map(p=>({value:p,textStyle:{fontSize:9}})),axisLabel:{rotate:40,fontSize:9}},
      yAxis:{type:'category',data:m.features.map(f=>({value:f,textStyle:{fontSize:8}})),axisLabel:{fontSize:8}},
      visualMap:{min:-6,max:0,orient:'horizontal',left:'center',bottom:0,textStyle:{fontSize:9},
        inRange:{color:['#fff7ec','#fc8d59','#b30000']}},
      series:[{type:'heatmap',data:vals}]};
  };
  const matrixOptVal=matrixOpt();
  const dq=(data.dq&&data.dq.rows)||[]; const sens=(data.sens&&data.sens.rows)||[];
  const s1=data.s1&&data.s1.success?data.s1:null;
  const coupRows=(data.coupling&&data.coupling.rows)||[];
  const synth=data.synth&&data.synth.success?data.synth:null;
  const wfTasks=(data.wf&&data.wf.success&&data.wf.tasks)||[];
  return (<>
    <div className="panel-title">项目结果</div>
    <div className="panel-desc">当前已归档的正式分析结果（只读展示）。</div>
    <div className="grid">
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>项目结论</h4>
        <div className="meta" style={{lineHeight:1.9}}>
          <div><strong>G_OH–log₁₀(k0_1) 局部补偿</strong> <span className="warn">[LOCAL_ONLY]</span>：
            约 <strong>0.11 eV/dec</strong>（0.11324/0.11689/0.10917），与正向 BV 的 (1−α) 尺度一致，
            但仅限 mixed_a 附近有限协议范围，非全局物理标度。</div>
          <div><strong>参数耦合</strong>：G_OH↔G_O、k0_3↔G_OH 强补偿（2D profile r≈+0.999/1.000）；
            k0_2 与其他参数独立，可独立约束。</div>
          <div><strong>A6 状态</strong>：六参数单点恢复资格失败；k0_4 只能作为固定输入传播；
            无统一六维线性降维；V4.1 三协议在无噪声合成下无法恢复（S1 DESIGN_INSUFFICIENT）。</div>
        </div>
        <div className="hint" style={{marginTop:6}}>完整结论与边界见 <code>documents/project/PROJECT_SUMMARY.md</code>；
          本窗口为当前项目已确认结论（工程/数值等级），不自动升级为机理结论。</div>
      </div>
      <div className="card">
        <h4>实验数据质量</h4>
        <table><thead><tr><th>数据集</th><th>频率</th><th>振幅</th><th>拟合通道</th></tr></thead>
        <tbody>{dq.map(r=><tr key={r.filename}><td>{r.filename.replace('ftacv','FT')}</td><td>{r.f||'—'}</td><td>{r.dE||'—'}</td><td>{r.fit_harmonics||'n/a'}</td></tr>)}</tbody></table>
      </div>
      <div className="card">
        <h4>A6 参数分类</h4>
        <table><thead><tr><th>参数</th><th>分类</th><th>最大相关</th></tr></thead>
        <tbody>{sens.map(r=><tr key={r.parameter}>
          <td>{r.parameter}</td><td className={r.classification==='identifiable'?'ok':r.classification==='coupled'?'warn':'err'}>{r.classification}</td>
          <td>{Number(r.max_correlation).toFixed(2)}</td></tr>)}</tbody></table>
      </div>
      <div className="card">
        <h4>A6-v2 S1 合成恢复</h4>
        {s1?<div className="meta" style={{lineHeight:2}}>
          状态：<strong className={s1.scientific_gate_passed?'ok':'err'}>{s1.stage_status}</strong><br/>
          {s1.job_count} jobs × 100 trials · {s1.backend} · {s1.duration_h}h · {s1.n_ode_fail} ODE fail<br/>
          <span className="hint">eligible pairs：{s1.eligible_parameter_pairs.length===0?'（无）':s1.eligible_parameter_pairs.join(', ')}</span>
        </div>:<div className="hint">无 S1 归档</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>oer-wf 计算任务（只读 · Legion 正式计算归档）</h4>
        <table><thead><tr><th>任务</th><th>最新状态</th><th>runs</th><th></th></tr></thead>
          <tbody>{wfTasks.map(t=><tr key={t.task_id} style={{cursor:'pointer'}} onClick={()=>loadWfDetail(t.commit,t.task)}>
            <td>{t.task_id}</td>
            <td className={t.status==='SUCCESS'?'ok':'warn'}>{t.status}</td>
            <td>{t.runs}</td>
            <td style={{color:'var(--primary)',fontSize:11}}>{wfSel&&wfSel.commit===t.commit&&wfSel.task===t.task?'▾':'查看'}</td>
          </tr>)}</tbody></table>
        {wfSel&&wfSel.data&&wfSel.data.success&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
          <div className="meta" style={{marginBottom:6}}><strong>{wfSel.commit}/{wfSel.task}</strong> · {wfSel.data.runs.length} runs</div>
          {wfSel.data.runs.map(r=>(
            <div key={r.timestamp} style={{marginBottom:8}}>
              <div className="meta"><strong>{r.timestamp}</strong>
                {r.status&&<span className={r.status.status==='SUCCESS'?'ok':'warn'}> · {r.status.status}{r.status.exit_code!==undefined&&` · exit ${r.status.exit_code}`}</span>}
              </div>
              {r.summary&&<div className="hint">
                {r.summary.stage_status&&<span>stage_status: <b>{r.summary.stage_status}</b> · </span>}
                {r.summary.scientific_gate_passed!==undefined&&<span>科学门: <b>{r.summary.scientific_gate_passed?'PASS':'FAIL'}</b> · </span>}
                {r.summary.job_count&&<span>{r.summary.job_count} jobs · </span>}
                {r.summary.rows!==undefined&&<span>{r.summary.rows} rows · </span>}
                {r.summary.backend&&<span>{r.summary.backend}</span>}
              </div>}
              {r.files&&r.files.length>0&&<div className="hint" style={{marginTop:2}}>文件：{r.files.join(', ')}</div>}
            </div>))}
        </div>}
        {wfSel&&wfSel.error&&<div className="err hint" style={{marginTop:8}}>加载失败：{wfSel.error}</div>}
      </div>
      <div className="card">
        <h4>提交正式计算（Legion）</h4>
        <div className="row" style={{marginTop:0}}>
          <select value={wfSpec} onChange={e=>setWfSpec(e.target.value)} style={{flex:1,padding:'6px 8px',border:'1px solid var(--border-strong)',borderRadius:7,fontSize:12}}>
            {wfSpecs.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div className="row">
          <span className="meta">stage</span>
          {['prepare','smoke','formal'].map(s=>(<label key={s} style={{fontSize:12,display:'flex',alignItems:'center',gap:4}}>
            <input type="radio" name="wfstage" checked={wfStage===s} onChange={()=>setWfStage(s)}/>{s}
          </label>))}
        </div>
        <button className="btn btn-primary" style={{width:'100%',marginTop:10,background:'var(--warn)'}} onClick={submitWf} disabled={wfSubmitting}>
          {wfSubmitting?'提交中...':'提交正式计算'}
        </button>
        <div className="hint" style={{marginTop:6}}>会在 Legion 上执行 oer-wf（prepare → smoke → run），属写操作，请确认 spec 后再提交。</div>
        {wfSubmitResult&&<div className="meta" style={{marginTop:8}}>
          {wfSubmitResult.success?<>
            <strong>{wfSubmitResult.spec}</strong> · {wfSubmitResult.stage}
            {wfSubmitResult.result&&<><br/>状态：<b className={wfSubmitResult.result.status==='pass'?'ok':'warn'}>{wfSubmitResult.result.status}</b>
            {wfSubmitResult.result.message&&<div className="hint">{wfSubmitResult.result.message}</div>}</>}
          </>:<span className="err">提交失败：{wfSubmitResult.error}</span>}
        </div>}
      </div>
      <div className="card">
        <h4>参数耦合方向</h4>
        {coupRows.length>0?<table><thead><tr><th>参数对</th><th>相关</th><th>方向</th></tr></thead>
          <tbody>{coupRows.map(r=><tr key={r.parameter+'-'+r.peer}>
            <td>{r.parameter}↔{r.peer}</td><td>{Number(r.correlation).toFixed(3)}</td>
            <td className={r.direction==='compensating'?'err':'warn'}>{r.direction}</td></tr>)}</tbody></table>
        :<div className="hint">无耦合数据</div>}
      </div>
      <div className="card">
        <h4>合成恢复</h4>
        {synth?<div className="meta" style={{lineHeight:1.9}}>
          commit：<strong>{synth.git_commit}</strong><br/>
          配置：<span className="hint">{(synth.configuration&&JSON.stringify(synth.configuration)).slice(0,120)}…</span><br/>
          <span className="hint">完整 summary 见 JSON 归档</span>
        </div>:<div className="hint">无合成恢复数据</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>敏感性矩阵（特征 × 参数，log₁₀）</h4>
        {matrixOptVal?<ChartBox option={matrixOptVal} height={460}/>:<div className="hint" style={{padding:30,textAlign:'center'}}>无敏感性矩阵</div>}
      </div>
      <div className="card" style={{gridColumn:'1/-1'}}>
        <h4>二维参数耦合 profile</h4>
        <div className="row" style={{marginTop:0}}>
          <select value={profileSel} onChange={e=>setProfileSel(e.target.value)} style={{padding:'5px 8px',border:'1px solid var(--border-strong)',borderRadius:6,fontSize:12}}>
            {(data.p2d&&data.p2d.summaries||[]).map(s=><option key={s.profile_id} value={s.profile_id}>{s.profile_id}</option>)}
          </select>
        </div>
        {ho?<ChartBox option={ho} height={400}/>:<div className="hint" style={{padding:30,textAlign:'center'}}>加载 profile…</div>}
        <table style={{marginTop:8}}><thead><tr><th>profile</th><th>r</th><th>Δ1x</th><th>Δ1y</th><th>耦合</th></tr></thead>
        <tbody>{(data.p2d&&data.p2d.summaries||[]).map(s=><tr key={s.profile_id}>
          <td>{s.profile_id}</td><td>{s.pearson_r_in_delta1.toFixed(3)}</td><td>{s.delta1_x_width.toFixed(3)}</td><td>{s.delta1_y_width.toFixed(3)}</td>
          <td className={s.coupling_strength>0.7?'err':'ok'}>{s.coupling_interpretation}</td></tr>)}</tbody></table>
      </div>
    </div>
  </>);
}

/* ===================== App ===================== */
function App() {
  const [step,setStep]=useState('work');
  const [sample,setSample]=useState({});
  const [expData,setExpData]=useState(null);
  const [expAnalysis,setExpAnalysis]=useState(null);
  const [strictness,setStrictness]=useState('standard');
  const [error,setError]=useState(null);
  // 惰性挂载：首次进入某步才挂载组件（保证 ChartBox 在可见时初始化），之后保留状态
  const [visited,setVisited]=useState({work:true});
  const go=(id)=>{setStep(id);setVisited(v=>v[id]?v:{...v,[id]:true});};
  const steps=[
    {id:'work',label:'数据与正演',icon:'waveform'},
    {id:'results',label:'项目结果',icon:'chart'},
  ];
  const ICONS={
    waveform:<svg viewBox="0 0 16 16" fill="none"><path d="M1 8h2l1.5-5 2 10L8 3l2 10 1.5-5H14" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    chart:<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="8.5" width="2.6" height="5" rx=".5" fill="currentColor"/><rect x="6.7" y="4.5" width="2.6" height="9" rx=".5" fill="currentColor"/><rect x="11.4" y="1.5" width="2.6" height="12" rx=".5" fill="currentColor"/></svg>,
  };
  return (<div className="app">
    <div className="nav">
      <div className="titlebar-spacer"/>
      <div className="brand">OER 工作台<div className="sub">FTacV 参数反演</div></div>
      <div className="nav-list">
        {steps.map((s,i)=>(<div key={s.id} className={`nav-item ${step===s.id?'active':''}`} onClick={()=>go(s.id)}>
          <span className="ic">{ICONS[s.icon]}</span>{s.label}</div>))}
      </div>
      <div className="nav-foot">碱性 OER AEM · Co₃O₄<br/>展示层，计算外接</div>
    </div>
    <div className="main">
      {error&&<div className="tip" style={{background:'rgba(255,59,48,.12)',border:'1px solid rgba(255,59,48,.3)',color:'var(--accent)',marginBottom:12}}>{error}
        <span style={{float:'right',cursor:'pointer'}} onClick={()=>setError(null)}>✕</span></div>}
      {/* 已访问的步骤保留挂载（display 切换不丢状态）；未访问的不渲染，避免 display:none 下 echarts 初始化崩溃 */}
      {visited.work&&<div style={{display:step==='work'?'block':'none'}}>
        <WorkStep expData={expData} setExpData={setExpData} expAnalysis={expAnalysis} setExpAnalysis={setExpAnalysis}
          setError={setError} strictness={strictness} setStrictness={setStrictness} sample={sample} setSample={setSample}/>
      </div>}
      {visited.results&&<div style={{display:step==='results'?'block':'none'}}><ResultsStep setError={setError}/></div>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
