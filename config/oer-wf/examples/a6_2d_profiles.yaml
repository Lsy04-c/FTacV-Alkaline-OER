task_name: "a6_2d_profiles"
commit: "f92a3006dc3c141e2a8e6ca92b3504c3c5cbb701"
description: "Gate A6 selective 2-parameter profiles (lockin_only/hybrid × 6 pairs)"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  PYTHONPATH: "code/python/src"

build:
  required: false

script: "code/python/scripts/run_2d_profiles.py"
args: []
workers: 8
output_dir: "results/a6_2d_profiles"

smoke:
  enabled: true
  overrides:
    max_profiles: 1
    grid_points: 5
  expected_files:
    - "profile_2d_rows.csv"
    - "profile_2d_summary.json"
    - "run_manifest.json"
    - "STATUS.json"

expected_files:
  - "profile_2d_rows.csv"
  - "profile_2d_summary.json"
  - "run_manifest.json"
  - "STATUS.json"
validators:
  - schema_check
  - finite_check
  - provenance
