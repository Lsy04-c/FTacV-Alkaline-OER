task_name: "a7_workflow_smoke"
commit: "cbbcda5d2442ddc318d68df703ff37f08601f47f"
description: "Gate A7 workflow infrastructure verification"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

build:
  required: false

script: "scripts/a7_gate_test.py"
args: []
workers: 1
output_dir: "results/a7_workflow_smoke"

smoke:
  enabled: true
  overrides:
    n_samples: 1
    max_steps: 10
  expected_files:
    - "summary.csv"
    - "manifest.json"
    - "STATUS.json"

expected_files:
  - "summary.csv"
  - "manifest.json"
  - "STATUS.json"
validators:
  - schema_check
  - finite_check
  - provenance
  - manifest_hash
