task_name: "a6_optimizer_confirmation_cn"
commit: "1015a38364b514f597b2023478cb29659594669e"
description: "Gate A6 locked Sobol 51-study confirmation (hybrid, CN)"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

build:
  required: false

script: "code/python/scripts/run_optimizer_benchmark.py"
supports_resume: true
args:
  - "--phase"
  - "confirmation"
  - "--backend"
  - "cn"
  - "--budget"
  - "100"
  - "--noise-evidence"
  - "results/formal/identifiability/gate-a6-d9299f8/noise_evidence.json"
  - "--development-evidence"
  - "results/formal/identifiability/gate-a6-optimizer-development/development_evidence.json"
workers: 8
output_dir: "results/a6_optimizer_confirmation_cn"

smoke:
  enabled: true
  args:
    - "--smoke"
  overrides:
    max_jobs: 3
  expected_files:
    - "benchmark_plan.json"
    - "development_evidence.snapshot.json"
    - "results.jsonl"
    - "evaluations.jsonl"
    - "summary.json"
    - "confirmation_gate.json"
    - "STATUS.json"

expected_files:
  - "benchmark_plan.json"
  - "development_evidence.snapshot.json"
  - "results.jsonl"
  - "evaluations.jsonl"
  - "summary.json"
  - "confirmation_gate.json"
  - "STATUS.json"

validators:
  - schema_check
  - finite_check
  - provenance
  - optimizer_confirmation_gate

validator_config:
  optimizer_confirmation_gate:
    gate_version: 1
    recovery_gate_version: 2
    optimizer: "sobol_pattern"
    parameter_pairs:
      - ["k0_2", "k0_3"]
      - ["k0_2", "G_O"]
      - ["k0_3", "G_O"]
    truth_ids: ["center", "mixed_a", "mixed_b"]
    noise_fractions: [0.0, 0.001495726085983469]
    seeds: [7, 17, 27]
    optimization_budget: 100
    development_identity: ["center", 0.0, 7]
    development_evidence_sha256: "116099242f034c133f4895d068429673f0a12be611b76ea00cc3ebf415a83b8a"
    development_source_results_sha256: "e93ccab24c4a91d9d4d9a2b8e014826b6b1a07b7d0891c6e7dd944b78e17b432"
    max_median_normalized_bound_error: 0.025
    max_normalized_bound_error: 0.05
    max_seed_normalized_bound_dispersion: 0.05
    max_boundary_hit_rate: 0.0
