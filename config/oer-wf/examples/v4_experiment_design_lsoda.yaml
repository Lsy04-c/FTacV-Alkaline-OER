task_name: "v4_experiment_design_lsoda"
commit: "6c2084a2acfc8ea2f52956f924a9193366fbf4e6"
description: "V4 model-conditional FTacV acquisition protocol ranking"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  PYTHONPATH: "code/python/src"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

build:
  required: false

script: "code/python/scripts/run_v4_experiment_design.py"
supports_resume: true
resume_required_files:
  - "v4_task_spec.json"
  - "job_plan.json"
  - "forward_results.jsonl"
args:
  - "--task-spec"
  - "config/experiment-design/v4-computational-design.json"
workers: 8
output_dir: "results/experiment_design/v4"

smoke:
  enabled: true
  args:
    - "--smoke"
  overrides: {}
  expected_files:
    - "v4_task_spec.json"
    - "condition_catalog.csv"
    - "job_plan.json"
    - "forward_results.jsonl"
    - "sensitivity_matrices.jsonl"
    - "portfolio_gain.csv"
    - "linearity_check.csv"
    - "recommendation.json"
    - "run_manifest.json"
    - "STATUS.json"

expected_files:
  - "v4_task_spec.json"
  - "condition_catalog.csv"
  - "job_plan.json"
  - "forward_results.jsonl"
  - "sensitivity_matrices.jsonl"
  - "portfolio_gain.csv"
  - "linearity_check.csv"
  - "recommendation.json"
  - "run_manifest.json"
  - "STATUS.json"

validators:
  - "schema_check"
  - "finite_check"
  - "provenance"
  - "v4_experiment_design_gate"

validator_config:
  v4_experiment_design_gate:
    project_root: "."
    task_spec: "config/experiment-design/v4-computational-design.json"
    rerun_selected_smoke: false
    rerun_selected_formal: true
