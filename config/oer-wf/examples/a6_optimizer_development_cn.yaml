task_name: "a6_optimizer_development_cn"
commit: "a5b93f55e540682cc8cddb1fabbe63a7e0e92326"
description: "Gate A6 fixed-budget optimizer development gate (hybrid, CN)"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

build:
  required: false

script: "code/python/scripts/run_optimizer_benchmark.py"
supports_resume: true
args:
  - "--phase"
  - "development"
  - "--backend"
  - "cn"
  - "--budget"
  - "100"
  - "--noise-evidence"
  - "results/formal/identifiability/gate-a6-d9299f8/noise_evidence.json"
workers: 8
output_dir: "results/a6_optimizer_development_cn"

smoke:
  enabled: true
  args:
    - "--smoke"
  overrides:
    max_jobs: 3
  expected_files:
    - "benchmark_plan.json"
    - "results.jsonl"
    - "evaluations.jsonl"
    - "summary.json"
    - "selection.json"
    - "STATUS.json"

expected_files:
  - "benchmark_plan.json"
  - "results.jsonl"
  - "evaluations.jsonl"
  - "summary.json"
  - "selection.json"
  - "STATUS.json"

validators:
  - schema_check
  - finite_check
  - provenance
  - optimizer_benchmark_gate

validator_config:
  optimizer_benchmark_gate:
    gate_version: 1
    phase: "development"
    optimizers: ["tpe", "sobol_pattern", "de_fixed"]
    parameter_pairs:
      - ["k0_2", "k0_3"]
      - ["k0_2", "G_O"]
      - ["k0_3", "G_O"]
    truth_id: "center"
    noise_fraction: 0.0
    seed: 7
    optimization_budget: 100
    max_parameter_error: 0.05
    require_zero_ode_failures: true
    require_zero_boundary_hits: true
