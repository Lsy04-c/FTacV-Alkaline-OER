task_name: "v3_residual_attribution_lsoda"
commit: "f82d3918647bc0d414af912d294b467b02f047d6"
description: "V3 ensemble DC/H1-H3 residual attribution for FT2/FT3/FT4/FT8"

python:
  source: "main_repo"
  path: ".venv/bin/python"

worktree_root: "worktrees"

env:
  PYTHONPATH: "code/python/src"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

build:
  required: false

script: "code/python/scripts/run_v3_residual_attribution.py"
supports_resume: true
resume_required_files:
  - "v3_task_spec.json"
  - "selection.json"
  - "residual_curves.jsonl"
args:
  - "--task-spec"
  - "config/residual/v3-residual-attribution.json"
workers: 8
output_dir: "results/residual_attribution/v3"

smoke:
  enabled: true
  args:
    - "--smoke"
  overrides: {}
  expected_files:
    - "v3_task_spec.json"
    - "selection.json"
    - "residual_curves.jsonl"
    - "residual_matrix.csv"
    - "parameter_associations.csv"
    - "stress_directions.csv"
    - "attribution_evidence.csv"
    - "summary.json"
    - "run_manifest.json"
    - "STATUS.json"

expected_files:
  - "v3_task_spec.json"
  - "selection.json"
  - "residual_curves.jsonl"
  - "residual_matrix.csv"
  - "parameter_associations.csv"
  - "stress_directions.csv"
  - "attribution_evidence.csv"
  - "summary.json"
  - "run_manifest.json"
  - "STATUS.json"

validators:
  - "schema_check"
  - "finite_check"
  - "provenance"
  - "v3_residual_attribution_gate"

validator_config:
  v3_residual_attribution_gate:
    execution: "remote_worktree"
    timeout_sec: 1800
    project_root: "."
    task_spec: "config/residual/v3-residual-attribution.json"
    rerun_nearest_smoke: false
    rerun_nearest_formal: true
